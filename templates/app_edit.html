{% extends "layout.html" %}
{% block content %}
<a class="back" href="/apps/{{ app.id }}/settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>{{ app.name }}</a>
<div class="page-head"><div><h1>{{ app.name }} <span class="light">compose file</span></h1><p class="desc">Saving does not deploy.</p></div></div>
<form method="post" action="/apps/{{ app.id }}/edit" class="card">
  <div class="card-body"><textarea name="compose" rows="30" spellcheck="false" required class="code">{{ compose }}</textarea></div>
  <div class="card-foot row end"><a class="btn btn-ghost" href="/apps/{{ app.id }}/settings">Cancel</a><button class="btn btn-primary">Save</button></div>
</form>
{% endblock %}

{% extends "layout.html" %}
{% block content %}
<p><a href="/apps/{{ app.id }}">← {{ app.name }}</a></p>
<h1>{{ app.name }} · compose file</h1>
<form method="post" action="/apps/{{ app.id }}/edit" class="stack">
  <textarea name="compose" rows="30" spellcheck="false" required>{{ compose }}</textarea>
  <div class="row"><button class="primary">Save</button> <span class="muted small">saving does not deploy</span></div>
</form>
{% endblock %}

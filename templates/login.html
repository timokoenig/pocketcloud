<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>login · {{ name }}</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="login">
<main class="narrow">
  <h1>pocketcloud <span class="muted">{{ name }}</span></h1>
  {% if let Some(e) = error %}<div class="flash err">{{ e }}</div>{% endif %}
  <form method="post" action="/login" class="card stack">
    <label>Username <input name="username" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">Log in</button>
  </form>
</main>
</body></html>
